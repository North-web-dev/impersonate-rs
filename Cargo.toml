[package]
name = "impersonate-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Rust HTTP client with byte-exact browser TLS fingerprints (JA4). The Rust counterpart to impersonate-http."
license = "MIT"
repository = "https://github.com/North-web-dev/impersonate-rs"
readme = "README.md"
keywords = ["tls", "fingerprint", "ja4", "impersonate", "boringssl"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
boring = "=5.3.0"
boring-sys = "=5.3.0"
foreign-types-shared = "0.3.1"
tokio-boring = "=5.3.0"
tokio = { version = "1.44.2", features = ["net", "rt", "io-util", "macros", "time"] }
hyper = { version = "1.6.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.11", features = ["tokio"] }
http-body-util = "0.1.3"
bytes = "1.10.1"
url = "2.5.4"
brotli = "7.0.0"
flate2 = "1.1.1"
zstd = "0.13.3"
sha2 = "0.10.8"
hex = "0.4.3"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["full"] }
serde_json = "1.0.140"

[[bin]]
name = "measure"
path = "src/bin/measure.rs"

[[example]]
name = "get"
path = "examples/get.rs"
